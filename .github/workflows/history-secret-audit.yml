name: One-time Git History Secret Audit

on:
  push:
    paths:
      - '.github/workflows/history-secret-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all reachable Git blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --quiet
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[A-Za-z0-9-]{15,}'
          scanned=0
          flagged=0
          while IFS=' ' read -r oid path; do
            if [[ "$(git cat-file -t "$oid")" == 'blob' ]]; then
              scanned=$((scanned + 1))
              if LC_ALL=C grep -aEq -- "$pattern" < <(git cat-file blob "$oid"); then
                printf 'Suspicious blob: %s (%s)\n' "$oid" "${path:-unmapped}"
                flagged=$((flagged + 1))
              fi
              if [[ "${path:-}" =~ (^|/)(\.env|\.secrets|id_rsa|[^/]+\.pem|[^/]+\.p12|[^/]+\.key)$ ]]; then
                printf 'Sensitive file path: %s (%s)\n' "$oid" "$path"
                flagged=$((flagged + 1))
              fi
            fi
          done < <(git rev-list --objects --all)
          printf 'Inspected %s Git blobs. Potential findings: %s\n' "$scanned" "$flagged"
          if ((flagged > 0)); then exit 1; fi
