name: O Sync performance

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - 'root/services/sync.py'
      - 'root/tests/_test_performance_sync_overhead.py'
      - '.github/workflows/sync-performance.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout O
        uses: actions/checkout@v4
        with:
          path: o

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: ${{ github.head_ref == 'resource-subscription-ownership' && 'resource-subscription-ownership' || 'master' }}
          path: almasi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install -e ./almasi
          python -m pip install -r ./o/requirements.txt
          ln -s "$GITHUB_WORKSPACE/o" "$RUNNER_TEMP/almasi.o"

      - name: 'Benchmark Sync producer and worker overhead'
        working-directory: o
        env:
          ALMASI_PATH: ${{ runner.temp }}
        run: python root/tests/_test_performance_sync_overhead.py --size 3000 --rounds 3
