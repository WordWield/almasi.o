name: O Sync performance

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - 'root/services/sync.py'
      - 'root/tests/_test_performance_sync_overhead.py'
      - '.github/workflows/sync-performance.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout O
        uses: actions/checkout@v4
        with:
          path: o

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: master
          path: almasi

      - name: Checkout O baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline_o

      - name: Checkout shared Core
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi.a
          ref: d2aab02aec974fdac81284d9db849359682b90f8
          path: core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install -e ./almasi
          python -m pip install -r ./o/requirements.txt
          python -m pip install -r ./core/requirements.txt
          ln -s "$GITHUB_WORKSPACE/core" "$RUNNER_TEMP/almasi.a"
          ln -s "$GITHUB_WORKSPACE/o" "$RUNNER_TEMP/almasi.o"

      - name: 'Benchmark Sync producer and worker overhead'
        if: github.event_name != 'pull_request'
        working-directory: o
        env:
          ALMASI_PATH: ${{ runner.temp }}
        run: python root/tests/_test_performance_sync_overhead.py --size 3000 --rounds 3

      - name: Compare baseline and candidate in alternating rounds
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/sync_baseline"
          ln -s "$GITHUB_WORKSPACE/baseline_o" "$RUNNER_TEMP/sync_baseline/almasi.o"
          ln -s "$GITHUB_WORKSPACE/core" "$RUNNER_TEMP/sync_baseline/almasi.a"

          python - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          import sys

          workspace = os.environ['GITHUB_WORKSPACE']
          temporary = os.environ['RUNNER_TEMP']
          runner = os.path.join(workspace, 'o', 'root/tests/_test_performance_sync_overhead.py')
          environments = {
              'master': {
                  **os.environ,
                  'PYTHONPATH': os.path.join(workspace, 'almasi'),
                  'ALMASI_PATH': os.path.join(temporary, 'sync_baseline'),
              },
              'PR': {
                  **os.environ,
                  'PYTHONPATH': os.path.join(workspace, 'almasi'),
                  'ALMASI_PATH': temporary,
              },
          }
          cases = {
              'worker': ['--_json', '--mode', 'worker'],
              'subscriber': ['--_json', '--mode', 'subscriber'],
              'paused': ['--_json', '--mode', 'paused'],
              'dispatch': ['--dispatch'],
          }
          samples = {revision: {} for revision in environments}

          for round_index in range(5):
              revisions = tuple(environments)
              if round_index % 2:
                  revisions = tuple(reversed(revisions))
              for revision in revisions:
                  for case, arguments in cases.items():
                      completed = subprocess.run(
                          [sys.executable, runner, '--size', '3000', *arguments],
                          env=environments[revision], capture_output=True, text=True,
                      )
                      if completed.returncode:
                          raise RuntimeError(completed.stdout + completed.stderr)
                      values = json.loads(completed.stdout.strip().splitlines()[-1])
                      for name, microseconds in values.items():
                          samples[revision].setdefault(f'{case}/{name}', []).append(microseconds)
              print(f'Round {round_index + 1}/5 complete', flush=True)

          rows = ['| Operation | Master (us) | PR (us) | Delta |', '|---|---:|---:|---:|']
          for name in samples['master']:
              before = statistics.median(samples['master'][name])
              after = statistics.median(samples['PR'][name])
              rows.append(f'| {name} | {before:.3f} | {after:.3f} | {(after / before - 1) * 100:+.1f}% |')
          report = '\n'.join(rows)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(report + '\n')
          PY
