name: O performance

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: after

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'master' }}
          path: before

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: master
          path: almasi

      - name: Checkout shared Core
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi.a
          ref: cfb9dc94df967f39162af7a0e406518fe78f1c16
          path: core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -e ./almasi -r ./after/requirements.txt
          python -m pip install -r ./core/requirements.txt
          mkdir -p "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"
          ln -s "$GITHUB_WORKSPACE/core" "$RUNNER_TEMP/before/almasi.a"
          ln -s "$GITHUB_WORKSPACE/core" "$RUNNER_TEMP/after/almasi.a"
          ln -s "$GITHUB_WORKSPACE/before" "$RUNNER_TEMP/before/almasi.o"
          ln -s "$GITHUB_WORKSPACE/after" "$RUNNER_TEMP/after/almasi.o"

      - name: Benchmark the actual baseline and candidate
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          import sys

          workspace = os.environ['GITHUB_WORKSPACE']
          temporary = os.environ['RUNNER_TEMP']
          revisions = {
              'before': 'almasi',
              'after':  'almasi',
          }
          samples = {revision: [] for revision in revisions}

          for round_index in range(5):
              order = tuple(revisions) if round_index % 2 == 0 else tuple(reversed(revisions))

              for revision in order:
                  root = os.path.join(workspace, revision)
                  core = os.path.join(workspace, revisions[revision])
                  env = {
                      **os.environ,
                      'PYTHONPATH': core,
                      'ALMASI_PATH': os.path.join(temporary, revision),
                      'PYTHONHASHSEED': str(round_index),
                  }
                  runner = os.path.join(root, 'root/tests/_test_performance.py')
                  completed = subprocess.run(
                      [sys.executable, runner, '--size', '1000', '--workload', 'expanded', '--_mode', 'graph', '--_json'],
                      cwd=root, env=env, capture_output=True, text=True, check=True,
                  )
                  result = json.loads(completed.stdout.strip().splitlines()[-1])
                  samples[revision].append(result)
                  print(round_index, revision, result, flush=True)

          operations = list(samples['before'][0])
          assert 'define' in operations, 'Declaration workload missing'
          assert operations == list(samples['after'][0]), 'Benchmark cases differ'

          rows = ['| Operation | Before (us/op) | After (us/op) | Delta |', '|---|---:|---:|---:|']

          for operation in operations:
              before = statistics.median(run[operation] for run in samples['before'])
              after  = statistics.median(run[operation] for run in samples['after'])
              delta  = (after / before - 1) * 100
              rows.append(f'| {operation} | {before:.3f} | {after:.3f} | {delta:+.1f}% |')

          report = '\n'.join(rows)
          print(report, flush=True)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(report + '\n')
          PY
