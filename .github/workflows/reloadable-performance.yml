name: O ReloadableModule benchmark

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: after

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'master' }}
          path: before

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: ${{ github.head_ref == 'resource-subscription-ownership' && 'resource-subscription-ownership' || 'master' }}
          path: almasi

      - name: Checkout Almasi compatible with O master baseline
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: 106c98a13d0d6e8e7186145e8ab1473c4ac9b7e7
          path: almasi_before

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -e ./almasi -r ./after/requirements.txt
          mkdir -p "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"
          ln -s "$GITHUB_WORKSPACE/before" "$RUNNER_TEMP/before/almasi.o"
          ln -s "$GITHUB_WORKSPACE/after" "$RUNNER_TEMP/after/almasi.o"

      - name: Benchmark baseline and PR with declaration included
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          import sys

          def measure(revision):
          	root = os.path.join(os.environ['GITHUB_WORKSPACE'], revision)
          	env  = dict(os.environ)
          	almasi_path = 'almasi_before' if revision == 'before' else 'almasi'
          	almasi_root = os.path.join(os.environ['GITHUB_WORKSPACE'], almasi_path)
          	env['PYTHONPATH'] = almasi_root
          	env['ALMASI_PATH'] = os.path.join(os.environ['RUNNER_TEMP'], revision)
          	runner = os.path.join(root, 'root/tests/_test_performance.py')

          	completed = subprocess.run(
          		[sys.executable, runner, '--size', '1000', '--workload', 'expanded',
          		 '--_mode', 'graph', '--_json'],
          		cwd            = root,
          		env            = env,
          		capture_output = True,
          		text           = True,
          		check          = True,
          	)
          	return json.loads(completed.stdout.strip().splitlines()[-1])

          samples = {'before': [], 'after': []}

          for round_index in range(5):
          	order = ['before', 'after'] if round_index % 2 == 0 else ['after', 'before']
          	for revision in order:
          		print(f'Round {round_index + 1}: {revision}', flush=True)
          		samples[revision].append(measure(revision))

          operations = list(samples['before'][0])
          assert 'define' in operations, 'Declaration workload missing'
          assert operations == list(samples['after'][0]), 'Benchmark cases differ'

          rows = [
          	'| Operation | Before (us/op) | After (us/op) | Delta |',
          	'|---|---:|---:|---:|',
          ]

          for operation in operations:
          	before = statistics.median([run[operation] for run in samples['before']])
          	after  = statistics.median([run[operation] for run in samples['after']])
          	delta  = (after / before - 1) * 100
          	rows.append(f'| {operation} | {before:.3f} | {after:.3f} | {delta:+.1f}% |')

          report = '\n'.join([
          	'## O ReloadableModule performance',
          	'Python 3.12; 5 alternating rounds, 1000 iterations, isolated LMDB per run.',
          	'Lower is faster; medians in microseconds per operation.',
          	*rows,
          ])
          print(report, flush=True)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as file:
          	file.write(report + '\n')
          PY

      - name: Isolate cold and steady-state List reads
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          import sys
          import textwrap

          program = textwrap.dedent('''
              import json
              import os
              import statistics
              import tempfile
              import time
              from types import SimpleNamespace
              from almasi import o

              assert os.path.realpath(o.__path__) == os.path.join(os.environ['EXPECTED_ROOT'], 'root')

              with tempfile.TemporaryDirectory(prefix='o_read_perf_') as directory:
                  type(o).__app__ = SimpleNamespace(__lib_path__=directory)
                  o.start(tree_mode=False, multiprocess=False)
                  o.Timer.enabled = False
                  root = o.T.extend('APerfRun')
                  o.Timer.reset()
                  items = o.List([1, 2, 3, 4, 5])

                  cold = time.perf_counter_ns()
                  for index in range(1000):
                      items[index % 5]
                  cold = (time.perf_counter_ns() - cold) / 1000000

                  samples = []
                  for _ in range(5):
                      started = time.perf_counter_ns()
                      for index in range(100000):
                          items[index % 5]
                      samples.append((time.perf_counter_ns() - started) / 100000000)

                  print(json.dumps({'cold_1000': cold, 'warm_100000': statistics.median(samples)}))
                  o.services.Memory.env.close()
          ''')
          workspace = os.environ['GITHUB_WORKSPACE']
          temporary = os.environ['RUNNER_TEMP']
          samples = {'before': {}, 'after': {}}
          for round_index in range(7):
              order = tuple(samples) if round_index % 2 == 0 else tuple(reversed(samples))
              for revision in order:
                  environment = {
                      **os.environ,
                      'PYTHONPATH': os.path.join(workspace, 'almasi_before' if revision == 'before' else 'almasi'),
                      'ALMASI_PATH': os.path.join(temporary, revision),
                      'EXPECTED_ROOT': os.path.join(workspace, revision),
                  }
                  completed = subprocess.run([sys.executable, '-c', program], env=environment, capture_output=True, text=True)
                  if completed.returncode:
                      raise RuntimeError(completed.stdout + completed.stderr)
                  for case, elapsed in json.loads(completed.stdout.strip().splitlines()[-1]).items():
                      samples[revision].setdefault(case, []).append(elapsed)

          rows = ['| List read | Master (us) | PR (us) | Delta |', '|---|---:|---:|---:|']
          for case in samples['before']:
              before = statistics.median(samples['before'][case])
              after = statistics.median(samples['after'][case])
              rows.append(f'| {case} | {before:.3f} | {after:.3f} | {(after / before - 1) * 100:+.1f}% |')
          report = '\n'.join(rows)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(report + '\n')
          PY
