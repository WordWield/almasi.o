name: O ReloadableModule benchmark

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: after

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'master' }}
          path: before

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: master
          path: almasi

      - name: Checkout Almasi compatible with O master baseline
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: 106c98a13d0d6e8e7186145e8ab1473c4ac9b7e7
          path: almasi_before

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -e ./almasi -r ./after/requirements.txt
          mkdir -p "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"
          ln -s "$GITHUB_WORKSPACE/before" "$RUNNER_TEMP/before/almasi.o"
          ln -s "$GITHUB_WORKSPACE/after" "$RUNNER_TEMP/after/almasi.o"

      - name: Benchmark baseline and PR with declaration included
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          import sys

          def measure(revision):
          	root = os.path.join(os.environ['GITHUB_WORKSPACE'], revision)
          	env  = dict(os.environ)
          	almasi_path = 'almasi_before' if revision == 'before' else 'almasi'
          	almasi_root = os.path.join(os.environ['GITHUB_WORKSPACE'], almasi_path)
          	env['PYTHONPATH'] = almasi_root
          	env['ALMASI_PATH'] = os.path.join(os.environ['RUNNER_TEMP'], revision)
          	runner = os.path.join(root, 'root/tests/_test_performance.py')

          	completed = subprocess.run(
          		[sys.executable, runner, '--size', '1000', '--workload', 'expanded',
          		 '--_mode', 'graph', '--_json'],
          		cwd            = root,
          		env            = env,
          		capture_output = True,
          		text           = True,
          		check          = True,
          	)
          	return json.loads(completed.stdout.strip().splitlines()[-1])

          samples = {'before': [], 'after': []}

          for round_index in range(5):
          	order = ['before', 'after'] if round_index % 2 == 0 else ['after', 'before']
          	for revision in order:
          		print(f'Round {round_index + 1}: {revision}', flush=True)
          		samples[revision].append(measure(revision))

          operations = list(samples['before'][0])
          assert 'define' in operations, 'Declaration workload missing'
          assert operations == list(samples['after'][0]), 'Benchmark cases differ'

          rows = [
          	'| Operation | Before (us/op) | After (us/op) | Delta |',
          	'|---|---:|---:|---:|',
          ]

          for operation in operations:
          	before = statistics.median([run[operation] for run in samples['before']])
          	after  = statistics.median([run[operation] for run in samples['after']])
          	delta  = (after / before - 1) * 100
          	rows.append(f'| {operation} | {before:.3f} | {after:.3f} | {delta:+.1f}% |')

          report = '\n'.join([
          	'## O ReloadableModule performance',
          	'Python 3.12; 5 alternating rounds, 1000 iterations, isolated LMDB per run.',
          	'Lower is faster; medians in microseconds per operation.',
          	*rows,
          ])
          print(report, flush=True)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as file:
          	file.write(report + '\n')
          PY

      - name: Compare native namespace attribute assignment
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import statistics
          import subprocess
          import sys

          workspace = os.environ['GITHUB_WORKSPACE']
          temporary = os.environ['RUNNER_TEMP']
          candidate = os.path.join(temporary, 'almasi_native_attributes')
          shutil.copytree(os.path.join(workspace, 'almasi'), candidate, ignore=shutil.ignore_patterns('.git', '__pycache__'))

          directory = os.path.join(candidate, 'lib/directory.py')
          with open(directory) as stream:
              code = stream.read()
          old = 'self.__dict__[name] = result'
          assert code.count(old) == 1
          with open(directory, 'w') as stream:
              stream.write(code.replace(old, 'object.__setattr__(self, name, result)'))

          variants = {
              'baseline': ('before', os.path.join(workspace, 'almasi_before')),
              'current': ('after', os.path.join(workspace, 'almasi')),
              'native': ('after', candidate),
          }
          samples = {name: [] for name in variants}
          script = os.path.join(workspace, 'after/root/tests/_diagnose_list_read.py')

          for round_index in range(5):
              order = tuple(variants) if round_index % 2 == 0 else tuple(reversed(variants))
              for name in order:
                  revision, core = variants[name]
                  root = os.path.join(workspace, revision)
                  env = {
                      **os.environ,
                      'PYTHONPATH': core,
                      'ALMASI_PATH': os.path.join(temporary, revision),
                      'EXPECTED_ROOT': root,
                      'EXPECTED_CORE': core,
                      'PYTHONHASHSEED': str(round_index),
                  }
                  completed = subprocess.run([sys.executable, script], cwd=root, env=env, capture_output=True, text=True, check=True)
                  result = json.loads(completed.stdout.strip().splitlines()[-1])
                  print(round_index, name, result, flush=True)
                  samples[name].append(result)

          rows = ['| Case | Baseline | Current | Native | Native vs baseline |', '|---|---:|---:|---:|---:|']
          for case in samples['baseline'][0]:
              before, current, native = [statistics.median(x[case] for x in samples[name]) for name in variants]
              rows.append(f'| {case} | {before:.3f} | {current:.3f} | {native:.3f} | {(native / before - 1) * 100:+.1f}% |')

          report = '\n'.join(rows)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(report + '\n')
          PY
