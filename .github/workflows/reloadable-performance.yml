name: O ReloadableModule benchmark

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: after

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'master' }}
          path: before

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: 4482d2286ada0400db2fdfe6a3089684968bdcdd
          path: almasi

      - name: Checkout Almasi compatible with O master baseline
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: 106c98a13d0d6e8e7186145e8ab1473c4ac9b7e7
          path: almasi_before

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -e ./almasi -r ./after/requirements.txt
          mkdir -p "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"
          ln -s "$GITHUB_WORKSPACE/before" "$RUNNER_TEMP/before/almasi.o"
          ln -s "$GITHUB_WORKSPACE/after" "$RUNNER_TEMP/after/almasi.o"

      - name: Preserve native singleton method specialization
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import statistics
          import subprocess
          import sys

          workspace = os.environ['GITHUB_WORKSPACE']
          temporary = os.environ['RUNNER_TEMP']
          core = os.path.join(workspace, 'almasi')
          variants = {
              'baseline': ('before', os.path.join(workspace, 'almasi_before')),
              'current': ('after', core),
          }

          candidate = os.path.join(temporary, 'native_singleton')
          shutil.copytree(core, candidate, ignore=shutil.ignore_patterns('.git', '__pycache__'))
          changes = {
              'lib/directory.py': (
                  ('\t\tDirectory.__namespace_faces__.add(self)', '\t\tself.__dict__ = dict(self.__dict__.items())\n\t\tDirectory.__namespace_faces__.add(self)'),
              ),
              'almasi.py': (
                  ('\t\tDirectory.__namespace_faces__.add(instance)', '\t\tinstance.__dict__ = dict(instance.__dict__.items())\n\t\tDirectory.__namespace_faces__.add(instance)'),
              ),
              'lib/singleton.py': (
                  ('instance.__dict__[\'_initialize\']', 'instance._initialize'),
                  ('instance.__dict__[\'_is_initialized\']', 'instance._is_initialized'),
                  ('instance.__dict__[\'_is_initializing\']', 'instance._is_initializing'),
                  ('instance.__dict__[\'initialize\']', 'instance.initialize'),
                  ('self.__dict__[\'_initialize\']', 'self._initialize'),
                  ('self.__dict__[\'_is_initialized\']', 'self._is_initialized'),
                  ('self.__dict__[\'_is_initializing\']', 'self._is_initializing'),
                  ("self.__dict__.get('_is_initialized', True)", 'self._is_initialized'),
                  ("self.__dict__.get('_is_initializing', False)", 'self._is_initializing'),
                  ('\t__instance__ = None', '\t__instance__     = None\n\t_is_initialized  = True\n\t_is_initializing = False'),
              ),
          }
          for filename, replacements in changes.items():
              path = os.path.join(candidate, filename)
              with open(path) as stream:
                  code = stream.read()
              for old, new in replacements:
                  assert old in code, old
                  code = code.replace(old, new)
              with open(path, 'w') as stream:
                  stream.write(code)
          variants['native_singleton'] = ('after', candidate)

          samples = {name: [] for name in variants}
          script = os.path.join(workspace, 'after/root/tests/_diagnose_list_read.py')

          for round_index in range(5):
              order = tuple(variants) if round_index % 2 == 0 else tuple(reversed(variants))
              for name in order:
                  revision, core = variants[name]
                  root = os.path.join(workspace, revision)
                  env = {
                      **os.environ,
                      'PYTHONPATH': core,
                      'ALMASI_PATH': os.path.join(temporary, revision),
                      'EXPECTED_ROOT': root,
                      'EXPECTED_CORE': core,
                      'PYTHONHASHSEED': str(round_index),
                  }
                  benchmark = os.path.join(root, 'root/tests/_test_performance.py')
                  commands = (
                      ([sys.executable, benchmark, '--size', '1000', '--workload', 'expanded', '--_mode', 'graph', '--_json'], 'full/'),
                      ([sys.executable, script], 'diagnostic/'),
                  )
                  result = {}
                  for command, prefix in commands:
                      completed = subprocess.run(command, cwd=root, env=env, capture_output=True, text=True)
                      if completed.returncode:
                          raise RuntimeError(completed.stdout + completed.stderr)
                      result.update({prefix + key: value for key, value in json.loads(completed.stdout.strip().splitlines()[-1]).items()})
                  print(round_index, name, result, flush=True)
                  samples[name].append(result)

          rows = ['| Case | Baseline | Current | Native singleton | Delta |', '|---|---:|---:|---:|---:|']
          for case in samples['baseline'][0]:
              values = [statistics.median(x[case] for x in samples[name]) for name in variants]
              rows.append('| ' + case + ' | ' + ' | '.join(f'{value:.3f}' for value in values) + f' | {(values[-1] / values[0] - 1) * 100:+.1f}% |')

          report = '\n'.join(rows)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(report + '\n')
          PY

      - name: Verify candidate core contracts
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/native_singleton" python -c 'import almasi; almasi.tester.run()'
