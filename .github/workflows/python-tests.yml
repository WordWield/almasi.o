name: O Python tests

on:
  push:
    branches: [master, diagnose/macos-class-loading]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.11'

    steps:
      - name: Checkout O
        uses: actions/checkout@v4
        with:
          path: o

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: master
          path: almasi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install -e ./almasi
          python -m pip install -r ./o/requirements.txt

      - name: Expose the checked-out O library to Almasi
        run: ln -s "$GITHUB_WORKSPACE/o" "$RUNNER_TEMP/almasi.o"

      - name: Run isolated O tests
        env:
          ALMASI_PATH: ${{ runner.temp }}
        run: python o/root/test.py

  installed_mac:
    runs-on: macos-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Almasi from Git
        run: python -m pip install 'git+https://github.com/WordWield/almasi.git'

      - name: Load O through the lazy library installer
        run: python -c 'from almasi import o; print(o.__path__)'

      - name: Run cached O tests twice in fresh Python processes
        run: |
          python "$HOME/.cache/almasi/libraries/almasi.o/root/test.py"
          python "$HOME/.cache/almasi/libraries/almasi.o/root/test.py"
