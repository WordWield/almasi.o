name: O Python tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout O
        uses: actions/checkout@v4
        with:
          path: o

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: ${{ github.head_ref == 'resource-subscription-ownership' && 'resource-subscription-ownership' || 'master' }}
          path: almasi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install -e ./almasi
          python -m pip install -r ./o/requirements.txt

      - name: Expose the checked-out O library to Almasi
        run: ln -s "$GITHUB_WORKSPACE/o" "$RUNNER_TEMP/almasi.o"

      - name: Run isolated O tests
        env:
          ALMASI_PATH: ${{ runner.temp }}
        run: python o/root/test.py
