name: O Python tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout O
        uses: actions/checkout@v4
        with:
          path: o

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: apodgorny/almasi
          ref: fix/auto-reload-metaclass-20261118
          path: almasi

      - name: Checkout baseline Almasi
        uses: actions/checkout@v4
        with:
          repository: apodgorny/almasi
          ref: master
          path: almasi_before

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Almasi, O, and test dependencies
        run: |
          python -m pip install -e ./almasi
          python -m pip install -e ./o
          python -m pip install jsonschema

      - name: Run Sync correctness tests
        working-directory: o
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from types import SimpleNamespace

          sys.path.insert(0, 'root')
          import o

          with tempfile.TemporaryDirectory(prefix='o_test_') as directory:
          	type(o).__app__ = SimpleNamespace(__lib_path__=directory)
          	o.start()
          	import tester
          	o.tests.TestSync.run()
          PY

      - name: Run Tracker public API correctness tests
        working-directory: o
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from types import SimpleNamespace

          sys.path.insert(0, 'root')
          import o

          with tempfile.TemporaryDirectory(prefix='o_test_') as directory:
          	type(o).__app__ = SimpleNamespace(__lib_path__=directory)
          	o.start()
          	import tester
          	o.tests.TestTrackerPublicApi.run()
          PY

      - name: Run O ontology tests
        working-directory: o
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from types import SimpleNamespace

          sys.path.insert(0, 'root')
          import o

          with tempfile.TemporaryDirectory(prefix='o_test_') as directory:
          	type(o).__app__ = SimpleNamespace(__lib_path__=directory)
          	o.start()
          	import tester
          	test_count, method_count = o.tester.run_layer(o)
          	assert test_count > 0 and method_count > 0
          	print(f'All O tests passed: {test_count} classes, {method_count} methods')
          PY

      - name: Verify coupled O source auto-reload and root exclusion
        working-directory: o
        run: |
          python - <<'PY'
          import os
          import sys
          import tempfile
          from types import SimpleNamespace
          from unittest.mock import patch

          sys.path.insert(0, 'root')
          import a
          import o

          with tempfile.TemporaryDirectory(prefix='o_reload_') as store:
          	type(o).__app__ = SimpleNamespace(__lib_path__=store)
          	o.start()

          	with tempfile.TemporaryDirectory(dir=o.__path__, prefix='__reload_check_') as path:
          		filename = os.path.join(path, 'foo.py')
          		directory = a.Directory(o, path, 'o.' + os.path.basename(path))

          		def source(version):
          			return ('import o\nclass Foo(o.T):\n\tname: str\n'
          			        '\tdef hello(self):\n\t\treturn ' + repr(version) + '\n')

          		with open(filename, 'w', encoding='utf-8') as stream:
          			stream.write(source('before'))

          		with patch.object(type(a.services.Filesystem), '_watch', return_value=None):
          			Foo = directory.Foo
          			assert '_reload_subscription' not in o.T.__dict__
          			assert '_reload_subscription' in Foo.__dict__
          			instance = Foo(name='alex')
          			assert instance.hello() == 'before'

          			with open(filename, 'w', encoding='utf-8') as stream:
          				stream.write(source('after'))

          			a.services.Filesystem._changed_paths(o.__path__, {filename: 'modified'})
          			assert instance.hello() == 'after'
          			assert instance.name == 'alex'
          			assert o.services.Cache.entities[Foo.id] is type(instance)
          			assert directory.Foo is type(instance)
          			type(instance)._reload_subscription.cancel()

          print('Coupled O hot reload validated')
          PY

      - name: Benchmark baseline Memory and Tracker (master)
        working-directory: o
        run: |
          git fetch origin master
          git restore --source=origin/master --worktree root/services root/t.py root/t_meta.py
          PYTHONPATH="$GITHUB_WORKSPACE/almasi_before${PYTHONPATH:+:$PYTHONPATH}" python root/tests/_test_performance_write_tracking.py --size 1500 --rounds 3
          PYTHONPATH="$GITHUB_WORKSPACE/almasi_before${PYTHONPATH:+:$PYTHONPATH}" python root/tests/_test_performance_tracker.py --size 1000 --rounds 3
          git restore --source=HEAD --worktree root/services root/t.py root/t_meta.py

      - name: Benchmark Memory without IPL and read-only Tracker (PR)
        working-directory: o
        run: |
          python root/tests/_test_performance_write_tracking.py --size 1500 --rounds 3
          python root/tests/_test_performance_tracker.py --size 1000 --rounds 3

      - name: Benchmark immediate per-ID notifications and commit confirmation (PR)
        working-directory: o
        run: python root/tests/_test_performance_write_tracking.py --size 1500 --rounds 3 --sync stub
