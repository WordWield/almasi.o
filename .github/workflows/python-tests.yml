name: O Python tests

on:
  push:
    branches: [master, split-core, typed-operation-service]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout O
        uses: actions/checkout@v4
        with:
          path: o

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: master
          path: almasi

      - name: Checkout Core Strict
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi.a
          ref: 90675e466843186fa3e7bac731d677b6d3b5b165
          path: core

      - name: Checkout pre-Annotation O
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi.o
          ref: b08cbe9f3358f842be6bf641a6daeb5a6d5b8aff
          path: previous_o

      - name: Checkout pre-Annotation Core
        uses: actions/checkout@v4
        with:
          repository: WordWield/almasi.a
          ref: 14d750dedd512968c89e0da056fb116500f2d9f1
          path: previous_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install -e ./almasi
          python -m pip install -r ./o/requirements.txt

      - name: Expose the checked-out O library to Almasi
        run: |
          ln -s "$GITHUB_WORKSPACE/core" "$RUNNER_TEMP/almasi.a"
          ln -s "$GITHUB_WORKSPACE/o" "$RUNNER_TEMP/almasi.o"
          python -m pip install -r "$GITHUB_WORKSPACE/core/requirements.txt"

      - name: Verify resource, Sync, Tracker and Transport contracts
        working-directory: o/root
        env:
          ALMASI_PATH: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import tempfile
          from types import SimpleNamespace
          from almasi import o
          import tester

          with tempfile.TemporaryDirectory(prefix='o_subscription_test_') as directory:
            type(o).__app__ = SimpleNamespace(__lib_path__=directory)
            o.start()

            o.tests.TestComputedResource.run()
            o.tests.TestSync.run()
            o.tests.TestTracker.run()
            o.tests.TestTrackerPublicApi.run()
            o.tests.TestTrackerTransparency.run()
            o.tests.TestTrackerWrites.run()
            o.tests.TestTransport.run()
          PY

      - name: Run isolated O tests
        env:
          ALMASI_PATH: ${{ runner.temp }}
        run: python o/root/test.py

      - name: Verify old and new O reopen the same persistent annotation graph
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/annotation-migration.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -p "$work/previous" "$work/current"
          ln -s "$GITHUB_WORKSPACE/previous_core" "$work/previous/almasi.a"
          ln -s "$GITHUB_WORKSPACE/previous_o" "$work/previous/almasi.o"
          ln -s "$GITHUB_WORKSPACE/core" "$work/current/almasi.a"
          ln -s "$GITHUB_WORKSPACE/o" "$work/current/almasi.o"
          cat > "$work/check.py" <<'PY'
          import json
          import os
          import sys
          from types import SimpleNamespace
          from almasi import o

          directory, mode = sys.argv[1:]
          type(o).__app__ = SimpleNamespace(__lib_path__=directory)

          for ontology in (o, o.fork('migration_fork')):
              ontology.start(sync=True)
              snapshot_path = os.path.join(directory, ontology.__dict__.get('__fork_name__', 'default') + '.json')

              if mode == 'write':
                  Person = ontology.T.extend('MigrationPerson', name=str)
                  Child = Person.extend('Child', age=int)
                  Collection = ontology.T.extend(
                      'MigrationCollection',
                      people=ontology.F(list[Person]),
                      mapping=ontology.F(dict[str, Child]),
                  )
                  person = Person(name='Ada')
                  child = Child(name='Lin', age=7)
                  ontology.V.annotation_migration = Collection(
                      people=[person], mapping={'child': child},
                  )

              collection = ontology.V.annotation_migration
              Collection = type(collection)
              Person = ontology.T.MigrationPerson
              Child = Person.Child
              assert Collection is ontology.T.MigrationCollection
              assert type(collection.people[0]) is Person
              assert type(collection.mapping['child']) is Child
              assert collection.people[0].name == 'Ada'
              assert collection.mapping['child'].age == (8 if mode == 'reopen' else 7)

              snapshot = {
                  'data': collection.to_data(),
                  'ids': [Person.id, Child.id, Collection.id, collection.id, collection.people[0].id, collection.mapping['child'].id],
                  'fields': {},
                  'annotations': [],
              }
              for name in ('people', 'mapping'):
                  field_type = getattr(Collection._, name).type
                  annotation = field_type.__annotation__
                  snapshot['fields'][name] = [
                      field_type.id, field_type.__proto__,
                      ontology.services.Memory.get(field_type.__proto__ + '.__annotation__'),
                      annotation.id, str(annotation), hash(annotation), annotation.to_source(),
                  ]
              assert Collection._.people.type.__annotation__.annotation == list[Person]
              assert Collection._.mapping.type.__annotation__.annotation == dict[str, Child]

              for declaration in (list[Person], dict[str, Child], list[Person | Child | None], tuple[Child, ...]):
                  annotation = ontology.Annotation(declaration)
                  restored = ontology.Annotation(annotation.to_source())
                  assert restored.annotation == declaration
                  snapshot['annotations'].append([annotation.id, str(annotation), hash(annotation), annotation.to_source()])

              if mode == 'write':
                  with open(snapshot_path, 'w') as stream:
                      json.dump(snapshot, stream)
              else:
                  with open(snapshot_path) as stream:
                      assert snapshot == json.load(stream), (mode, snapshot)
                  if mode == 'upgrade':
                      collection.mapping['child'].age = 8
                      assert collection.mapping['child'].age == 8
                      snapshot['data'] = collection.to_data()
                      with open(snapshot_path, 'w') as stream:
                          json.dump(snapshot, stream)

              ontology.services.Memory.env.close()
              print(mode, ontology.__dict__.get('__fork_name__', 'default'), 'PASS')
          PY
          ALMASI_PATH="$work/previous" python "$work/check.py" "$work" write
          ALMASI_PATH="$work/current" python "$work/check.py" "$work" upgrade
          ALMASI_PATH="$work/previous" python "$work/check.py" "$work" reopen
